            '92': { name: '六煞', type: '凶', level: 4, desc: '细腻敏锐。略显多愁善感，遇到决策时容易错失良机。' },

            '17': { name: '祸害', type: '凶', level: 1, desc: '口舌是非、小人作梗。口才极佳能说会道，但也最易言多必失。' },
            '71': { name: '祸害', type: '凶', level: 1, desc: '口舌是非、小人作梗。口才极佳能说会道，但也最易言多必失。' },
            '89': { name: '祸害', type: '凶', level: 2, desc: '嘴硬爱辩、血光隐患。行事言语过于直接，极易无意招惹怨气。' },
            '98': { name: '祸害', type: '凶', level: 2, desc: '嘴硬爱辩、血光隐患。行事言语过于直接，极易无意招惹怨气。' },
            '46': { name: '祸害', type: '凶', level: 3, desc: '爱抱怨、抵抗力弱。情绪容易宣泄不满，体质较容易疲劳。' },
            '64': { name: '祸害', type: '凶', level: 3, desc: '爱抱怨、抵抗力弱。情绪容易宣泄不满，体质较容易疲劳。' },
            '23': { name: '祸害', type: '凶', level: 4, desc: '言语啰唆。常纠结琐碎小事唠叨，言语分量不足。' },
            '32': { name: '祸害', type: '凶', level: 4, desc: '言语啰唆。常纠结琐碎小事唠叨，言语分量不足。' },
        };

        let currentResultData = null;

        const form = document.getElementById('analyzeForm');
        const numberInput = document.getElementById('numberInput');
        const submitBtn = document.getElementById('submitBtn');
        const btnText = document.getElementById('btnText');
        const errorMsg = document.getElementById('errorMsg');
        const errorText = document.getElementById('errorText');
        const resultContainer = document.getElementById('resultContainer');
        const copyBtn = document.getElementById('copyBtn');
        
        const numberChain = document.getElementById('numberChain');
        const detailedGrid = document.getElementById('detailedGrid');
        const statJi = document.getElementById('statJi');
        const statXiong = document.getElementById('statXiong');
        const statPing = document.getElementById('statPing');
        const barJi = document.getElementById('barJi');
        const barXiong = document.getElementById('barXiong');
        const barPing = document.getElementById('barPing');
        const masterAdvice = document.getElementById('masterAdvice');
        const specialComboContainer = document.getElementById('specialComboContainer');
        const specialComboList = document.getElementById('specialComboList');

        function getStarColorClasses(type) {
            if (type === '吉') return 'bg-emerald-500/10 text-emerald-400 border-emerald-500/20';
            if (type === '凶') return 'bg-red-500/10 text-red-400 border-red-500/20';
            return 'bg-gold-500/10 text-gold-400 border-gold-500/20';
        }

        form.addEventListener('submit', function(e) {
            e.preventDefault();
            const inputValue = numberInput.value.trim();
            if (!inputValue) return;

            errorMsg.classList.add('hidden');
            resultContainer.classList.add('hidden');
            submitBtn.disabled = true;
            btnText.innerHTML = '<i class="ph ph-spinner ph-spin text-lg mr-2"></i> 测排中...';

            const cleanNum = inputValue.replace(/\D/g, '');
            if (cleanNum.length < 2) {
                errorText.textContent = "请输入至少包含 2 位有效数字的号码！";
                errorMsg.classList.remove('hidden');
                submitBtn.disabled = false;
                btnText.innerHTML = '立即解析';
                return;
            }

            setTimeout(() => {
                const pairs = [];
                const summary = { 吉: 0, 凶: 0, 平: 0, 财库: false, 桃花: false, 口舌: false, 投资: false };
                
                // === 修复高阶易理算法：穿透 0（隐） 和 5（显），抓取本源磁场 ===
                let coreDigits = [];
                for(let i=0; i<cleanNum.length; i++) {
                    if(cleanNum[i] !== '0' && cleanNum[i] !== '5') {
                        coreDigits.push({ val: cleanNum[i], idx: i });
                    }
                }

                if (coreDigits.length < 2) {
                    for (let i = 0; i < cleanNum.length - 1; i++) {
                        let pairStr = cleanNum.slice(i, i + 2);
                        pairs.push({ pair: pairStr, basePair: pairStr, name: '伏位', type: '平', level: 4, displayName: '伏位4', desc: '过渡或停滞磁场。' });
                    }
                } else {
                    for (let i = 0; i < coreDigits.length - 1; i++) {
                        let d1 = coreDigits[i];
                        let d2 = coreDigits[i+1];
                        let basePair = d1.val + d2.val;
                        let star = STAR_MAPPING[basePair] || { name: '未知', type: '平', level: 4, desc: '' };
                        
                        let actualStr = cleanNum.substring(d1.idx, d2.idx + 1);

                        // 判别0和5的隐显属性
                        let has0 = actualStr.includes('0');
                        let has5 = actualStr.includes('5');
                        let modifier = '';
                        let modifierDesc = '';

                        if (has0 && has5) {
                            modifier = '显 隐';
                            modifierDesc = ' (阵中含0与5，该磁场能量隐显交替、易生突变)';
                        } else if (has0) {
                            modifier = '隐';
                            modifierDesc = ' (阵中含0，该磁场隐性化、处于暗处或被动)';
                        } else if (has5) {
                            modifier = '显';
                            modifierDesc = ' (阵中含5，该磁场显性化、被加强或凸显)';
                        }

                        let displayName = `${star.name}${star.level}`;
                        if (modifier) displayName += `-${modifier}`;

                        pairs.push({
                            pair: actualStr,
                            basePair: basePair, // 始终是 2 位数的基础对
                            name: star.name,
                            type: star.type,
                            level: star.level,
                            modifier: modifier,
                            displayName: displayName,
                            desc: star.desc + modifierDesc
                        });
                    }
                }

                // 统计阵列
                pairs.forEach(p => {
                    summary[p.type]++;
                    if (p.name === '天医') summary.财库 = true;
                    if (p.name === '六煞') summary.桃花 = true;
                    if (p.name === '祸害') summary.口舌 = true;
                    if (p.name === '绝命') summary.投资 = true;
                });

                // === 🌟 特殊组合深度解析引擎 ===
                let specialNotes = [];
                for (let i = 0; i < pairs.length - 1; i++) {
                    let p1 = pairs[i];
                    let p2 = pairs[i+1];
                    let comboStr = p1.basePair + p2.basePair.substring(1); 

                    // 1. 天医 + 伏位 (钱的流动)
                    if (p1.name === '天医' && p2.name === '伏位') {
                        if (p1.level === 1 && p2.level > 1) {
                            specialNotes.push(`【${comboStr}】大天医遇小伏位 (钱越来越少)：磁场能量减弱，暗示大财化小，钱越赚越少，需注意理财。`);
                        } else if (p1.level === 1 && p2.level === 1) {
                            specialNotes.push(`【${comboStr}】大天医遇大伏位 (钱持续有)：天医高能量延续，暗示财源不断，赚钱势头持续向好。`);
                        }
                    }
                    // 2. 天医 + 延年 (老板格局)
                    else if (p1.name === '天医' && p2.name === '延年') {
                        specialNotes.push(`【${comboStr}】天医+延年 (老板/主管格局)：具有领导才能，懂得理财与守财，且对感情有极强责任心。`);
                    }
                    // 3. 生气 + 天医 (贵人送财)
                    else if (p1.name === '生气' && p2.name === '天医') {
                        specialNotes.push(`【${comboStr}】生气+天医 (贵人给钱)：情商极高，人脉广阔，主有贵人相助并直接为你带来财富。`);
                    }
                }
                specialNotes = [...new Set(specialNotes)]; // 去重

                // 生成总体直断文案
                let advice = `本号共衍出 ${pairs.length} 组核心游年磁场阵列。\n\n`;
                const lastStar = pairs[pairs.length - 1];
                
                if (summary.财库) {
                    advice += "【天医重现】得局中「天医」财星照拂，主有正财偏财库，利于商贾金融或业绩成长。";
                } else {
                    advice += "【求财辛苦】局中未见明显「天医」财星，求财常有波折阻隔，不易轻取盈余。";
                }

                if (summary.投资 && !summary.财库) {
                    advice += "局内见「绝命」无财星收官，为典型的急躁投机、财进财出之势。";
                }

                if (summary.桃花) {
                    advice += "\n「六煞」入局，异性缘与情感细腻敏锐，然需警惕优柔寡断带来的烂桃花与思虑内耗。";
                }

                advice += `\n\n【尾星定乾坤】 号码终以第${lastStar.level}级【${lastStar.displayName}】收尾。`;
                if (lastStar.type === '凶') {
                    advice += `\n易理最忌凶星终结，【${lastStar.name}】收盘，行事易呈蛇头蛇尾之势，中途风光而结局溃败，常使自身平添无形压力，建议尽早调和调补。`;
                } else if (lastStar.name === '延年' || lastStar.name === '天医') {
                    advice += `\n瑞兆收盘，代表做事行之有果，财富或事业能够在最尾端妥帖收库、扎根稳住。`;
                } else {
                    advice += `\n守成过渡收盘，行事偏向平缓被动。建议配合先天生辰综合调和更佳。`;
                }

                currentResultData = { original: cleanNum, displayInput: inputValue, pairs, summary, advice, specialNotes };
                renderResult();

                submitBtn.disabled = false;
                btnText.innerHTML = '重新排盘';
            }, 800);
        });

        function renderResult() {
            const { pairs, summary, advice, specialNotes } = currentResultData;
            const totalPairs = pairs.length;
            const numLevels = ['一', '二', '三', '四'];

            // 1. 渲染数字链
            let chainHtml = '';
            pairs.forEach((p, idx) => {
                const colorClasses = getStarColorClasses(p.type);
                chainHtml += `
                    <div class="flex items-center">
                        <div class="flex flex-col items-center p-3 rounded-xl border backdrop-blur-md transition-all duration-300 hover:-translate-y-1 hover:border-gold-400/40 ${colorClasses}">
                            <span class="text-2xl md:text-3xl font-mono font-bold tracking-widest mb-1">${p.basePair}</span>
                            <span class="text-[10px] md:text-xs font-serif tracking-widest text-center mt-1">
                                【${p.displayName}】
                            </span>
                        </div>
                        ${idx < totalPairs - 1 ? '<i class="ph ph-caret-right text-slate-700 text-xs mx-1 md:mx-2"></i>' : ''}
                    </div>
                `;
            });
            numberChain.innerHTML = chainHtml + `<div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-transparent via-gold-500/20 to-transparent"></div>`;

            // 2. 渲染占比
            statJi.textContent = `${summary.吉} 组`;
            statXiong.textContent = `${summary.凶} 组`;
            statPing.textContent = `${summary.平} 组`;
            
            barJi.style.width = `${(summary.吉 / totalPairs) * 100}%`;
            barXiong.style.width = `${(summary.凶 / totalPairs) * 100}%`;
            barPing.style.width = `${(summary.平 / totalPairs) * 100}%`;

            // 3. 大师简批
            masterAdvice.textContent = advice;

            // 4. 特殊组合渲染
            if (specialNotes.length > 0) {
                let specialHtml = '';
                specialNotes.forEach(note => {
                    specialHtml += `
                        <div class="bg-gold-500/10 border border-gold-500/20 rounded-lg p-4 flex items-start">
                            <i class="ph-fill ph-sparkle text-gold-400 mt-0.5 mr-3"></i>
                            <p class="text-sm text-gold-100 font-light leading-relaxed">${note}</p>
                        </div>
                    `;
                });
                specialComboList.innerHTML = specialHtml;
                specialComboContainer.classList.remove('hidden');
            } else {
                specialComboContainer.classList.add('hidden');
            }

            // 5. 详情明细 (带级别格式: 第一级【五鬼1-隐】)
            let gridHtml = '';
            pairs.forEach(p => {
                const colorClasses = getStarColorClasses(p.type);
                gridHtml += `
                    <div class="bg-navy-950/40 p-5 rounded-xl border border-white/5 flex flex-col hover:border-gold-500/20 transition-all duration-300 group">
                        <div class="flex justify-between items-start mb-3">
                            <span class="font-mono text-xl font-bold text-white tracking-wider group-hover:text-gold-300 transition-colors">${p.basePair}</span>
                            <span class="text-[10px] tracking-widest px-2.5 py-1 rounded-full border font-serif ${colorClasses}">
                                第${numLevels[p.level-1]}级 · 【${p.displayName}】
                            </span>
                        </div>
                        <p class="text-xs text-slate-400 leading-relaxed font-light mt-auto">${p.desc}</p>
                    </div>
                `;
            });
            detailedGrid.innerHTML = gridHtml;

            resultContainer.classList.remove('hidden');
            setTimeout(() => {
                resultContainer.scrollIntoView({ behavior: 'smooth', block: 'start' });
            }, 100);
        }

        // 复制报告
        copyBtn.addEventListener('click', function() {
            if (!currentResultData) return;
            const { displayInput, pairs, advice, specialNotes } = currentResultData;
            const numLevels = ['一', '二', '三', '四'];
            const copyIcon = copyBtn.querySelector('i');
            const copyText = document.getElementById('copyBtnText');

            let text = `【星财八星数字能量解析】\n测算号码：${displayInput}\n\n`;
            text += `【能量阵列】：\n`;
            text += pairs.map(p => `[${p.basePair}] -> 第${numLevels[p.level-1]}级【${p.displayName}】 (${p.type}星)`).join('\n');
            
            if (specialNotes.length > 0) {
                text += `\n\n【特殊磁场解析】：\n`;
                text += specialNotes.join('\n');
            }

            text += `\n\n【易理直断】：\n${advice}\n\n* 声明：数字能量学为古哲先贤之磁场推演，分析结果仅供修心参考。`;
            
            const textarea = document.createElement('textarea');
            textarea.value = text;
            document.body.appendChild(textarea);
            textarea.select();
            try {
                document.execCommand('copy');
                copyIcon.className = 'ph-fill ph-check-circle mr-1 text-sm text-emerald-400';
                copyText.textContent = '已成功复制';
                copyText.classList.add('text-emerald-400');
                
                setTimeout(() => {
                    copyIcon.className = 'ph ph-copy mr-1.5 text-sm';
                    copyText.textContent = '复制完整报告';
                    copyText.classList.remove('text-emerald-400');
                }, 2000);
            } catch (err) {
                alert('复制失败，请手动选择并复制。');
            }
            document.body.removeChild(textarea);
        });
    </script>
</body>
</html>
