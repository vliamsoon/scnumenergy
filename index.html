    const Sparkles   = (p) => I(p, <><path d="M9.937 15.5A2 2 0 0 0 8.5 14.063l-6.135-1.582a.5.5 0 0 1 0-.962L8.5 9.936A2 2 0 0 0 9.937 8.5l1.582-6.135a.5.5 0 0 1 .963 0L14.063 8.5A2 2 0 0 0 15.5 9.937l6.135 1.581a.5.5 0 0 1 0 .964L15.5 14.063a2 2 0 0 0-1.437 1.437l-1.582 6.135a.5.5 0 0 1-.963 0z"/><path d="M20 3v4"/><path d="M22 5h-4"/><path d="M4 17v2"/><path d="M5 18H3"/></>);

    /* ─────────────── API Retry ─────────────── */
    const fetchWithRetry = async (url, options, retries = 5) => {
      const delays = [1000, 2000, 4000, 8000, 16000];
      for (let i = 0; i < retries; i++) {
        try {
          const res = await fetch(url, options);
          if (!res.ok) throw new Error(`HTTP ${res.status}`);
          return await res.json();
        } catch (err) {
          if (i === retries - 1) throw err;
          await new Promise(r => setTimeout(r, delays[i]));
        }
      }
    };

    /* ─────────────── 八星磁场数据 ─────────────── */
    const STAR_MAPPING = {

      '69':{ name:'绝命', type:'凶', level:2, desc:'好胜心强、盲目投资、大起大落' },

      '81':{ name:'五鬼', type:'凶', level:1, desc:'才华横溢、多变、诡异、暗财' },
      '79':{ name:'五鬼', type:'凶', level:2, desc:'鬼点子多、疑心重、不定性' },
      '97':{ name:'五鬼', type:'凶', level:2, desc:'鬼点子多、疑心重、不定性' },

      '17':{ name:'祸害', type:'凶', level:1, desc:'口才极佳、口舌是非、小人暗算' },
      '71':{ name:'祸害', type:'凶', level:1, desc:'口才极佳、口舌是非、小人暗算' },
      '89':{ name:'祸害', type:'凶', level:2, desc:'嘴硬、容易得罪人、血光' },
      '98':{ name:'祸害', type:'凶', level:2, desc:'嘴硬、容易得罪人、血光' },
      '46':{ name:'祸害', type:'凶', level:3, desc:'爱抱怨、身体虚弱' },
      '64':{ name:'祸害', type:'凶', level:3, desc:'爱抱怨、身体虚弱' },
      '23':{ name:'祸害', type:'凶', level:4, desc:'爱啰嗦、小病不断' },
      '32':{ name:'祸害', type:'凶', level:4, desc:'爱啰嗦、小病不断' },
    };

    const getStarData = (pair) => {
      if (STAR_MAPPING[pair]) return STAR_MAPPING[pair];
      let a = pair[0], b = pair[1];
      if ((a==='0'||a==='5') && (b==='0'||b==='5'))
        return { name:'伏位', type:'平', level:4, desc:'平缓、停滞、隐性显性交替' };
      if (a==='0'||a==='5') a = b;
      if (b==='0'||b==='5') b = a;
      return STAR_MAPPING[a+b] || { name:'未知', type:'平', level:4, desc:'过渡磁场' };
    };

    /* ─────────────── Markdown Renderer ─────────────── */
    const MarkdownRenderer = ({ text }) => {
      if (!text) return null;
      const html = text
        .replace(/\*\*(.*?)\*\*/g, '<strong class="text-amber-400">$1</strong>')
        .replace(/\*(.*?)\*/g,     '<em class="text-amber-200">$1</em>')
        .replace(/\n/g, '<br/>');
      return <div dangerouslySetInnerHTML={{ __html: html }} />;
    };

    /* ─────────────── API Key Modal ─────────────── */
    const ApiKeyModal = ({ onSave, onClose }) => {
      const [val, setVal] = useState(() => localStorage.getItem('gemini_api_key') || '');
      const save = () => { localStorage.setItem('gemini_api_key', val.trim()); onSave(val.trim()); onClose(); };
      return (
        <div className="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 flex items-center justify-center p-4">
          <div className="bg-slate-900 border border-amber-500/30 rounded-2xl p-6 w-full max-w-md shadow-2xl">
            <div className="flex justify-between items-center mb-4">
              <h3 className="text-lg font-bold text-amber-400 flex items-center">
                <KeyRound className="w-5 h-5 mr-2" /> 配置 Gemini API Key
              </h3>
              <button onClick={onClose} className="text-slate-500 hover:text-white transition-colors">
                <X className="w-5 h-5" />
              </button>
            </div>
            <p className="text-sm text-slate-400 mb-4">
              大师开示功能需要 Google Gemini API Key。
              获取地址：<a href="https://aistudio.google.com/app/apikey" target="_blank" rel="noopener noreferrer" className="text-amber-400 hover:underline">aistudio.google.com</a>
            </p>
            <input
              type="password"
              value={val}
              onChange={e => setVal(e.target.value)}
              onKeyDown={e => e.key === 'Enter' && save()}
              placeholder="AIza..."
              className="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-3 text-white placeholder-slate-500 outline-none focus:border-amber-500/50 mb-4 font-mono text-sm"
            />
            <button onClick={save}
              className="w-full bg-gradient-to-r from-amber-600 to-yellow-500 hover:from-amber-500 hover:to-yellow-400 text-slate-950 font-bold py-3 rounded-xl transition-all">
              保存 Key
            </button>
            <p className="text-xs text-slate-600 mt-3 text-center">Key 仅存储在您的浏览器本地，不会上传到任何服务器。</p>

      );
    };

    /* ─────────────── Main App ─────────────── */
    function App() {
      const [inputValue, setInputValue]   = useState('');
      const [isAnalyzing, setIsAnalyzing] = useState(false);
      const [result, setResult]           = useState(null);
      const [copied, setCopied]           = useState(false);
      const [errorMsg, setErrorMsg]       = useState('');
      const [showKeyModal, setShowKeyModal] = useState(false);

      const [apiKey, setApiKey]           = useState(() => localStorage.getItem('gemini_api_key') || '');
      const [aiFocus, setAiFocus]         = useState('综合运势');
      const [aiReading, setAiReading]     = useState('');
      const [isAiLoading, setIsAiLoading] = useState(false);
      const aiSectionRef = useRef(null);

      /* ── Analyze ── */
      const handleAnalyze = (e) => {
        e.preventDefault();
        if (!inputValue) return;
        setErrorMsg(''); setIsAnalyzing(true); setResult(null); setAiReading('');

        const cleanNum = inputValue.replace(/\D/g, '');
        if (cleanNum.length < 2) {
          setErrorMsg('请输入至少包含2位纯数字的号码！');
          setIsAnalyzing(false);
          return;
        }

        setTimeout(() => {
          const pairs = [];
          const summary = { 吉:0, 凶:0, 平:0, 财库:false, 桃花:false, 口舌:false, 投资:false };

          for (let i = 0; i < cleanNum.length - 1; i++) {
            const pairStr = cleanNum.slice(i, i+2);
            const star    = getStarData(pairStr);
            pairs.push({ pair: pairStr, ...star });
            summary[star.type]++;
            if (star.name==='天医') summary.财库 = true;
            if (star.name==='六煞') summary.桃花 = true;
            if (star.name==='祸害') summary.口舌 = true;
            if (star.name==='绝命') summary.投资 = true;
          }

          let advice = `这组号码总共解析出 ${pairs.length} 组磁场。\n`;
          if (summary.财库)
            advice += '✅ 此局带有【天医】磁场，主财运与正桃花，具有极强的赚钱潜力。';
          else
            advice += '⚠️ 此号缺乏【天医】财星，可能求财较为辛苦，容易财来财去一场空。';
          if (summary.投资 && !summary.财库)
            advice += '致命伤在于有【绝命】但无财星守库，这是典型的"拼搏投资破财局"，投资极容易大起大落。';
          if (summary.桃花)
            advice += '阵中带有【六煞】，说明你心思细腻，异性缘或交际圈不错，但需警惕烂桃花或情绪内耗。';

          const lastStar = pairs[pairs.length - 1];
          advice += `\n\n🎯 尾号定乾坤： 您的号码以【${lastStar.name}】收尾。`;
          if (lastStar.type === '凶')
            advice += `这在数字能量学中是大忌！${lastStar.name}收尾意味着结果往往波折、不稳定，容易功亏一篑。建议结合八字尽早调整。`;
          else if (lastStar.name==='延年' || lastStar.name==='天医')
            advice += '这属于非常不错的守财/升职局，能把赚到的财富和事业稳稳守住！';
          else
            advice += '整体结局偏向平缓，需结合您当下的运势具体论断。';

          setResult({ original: cleanNum, pairs, summary, advice });
          setIsAnalyzing(false);
        }, 1200);
      };

      /* ── Gemini AI ── */
      const generateAiReading = async () => {
        if (!result) return;
        const key = apiKey || localStorage.getItem('gemini_api_key') || '';
        if (!key) { setShowKeyModal(true); return; }

        setIsAiLoading(true); setAiReading('');
        setTimeout(() => aiSectionRef.current?.scrollIntoView({ behavior:'smooth', block:'start' }), 100);

        const pairsString = result.pairs.map(p => `[${p.pair}(${p.name}-${p.type})]`).join(' -> ');

        const systemPrompt = `
You are an expert old master in '八星数字能量学' (Eight-Star Digital Energy Numerology) based in Malaysia.
Your persona: Wise, direct, highly experienced, slightly colloquial (refer to yourself as '老头子' or '大师'), and caring but strict.
You analyze numbers deeply based on the combination of stars (天医, 延年, 生气, 伏位 vs 绝命, 五鬼, 六煞, 祸害) and their balance (Yin/Yang 阴阳平衡).
You never give generic advice. You always point out the fatal flaw (破财/烂桃花) and the hidden potential.
Do NOT use Markdown headers (# or ##), but you can use bolding (**text**) for emphasis.`;

        const userPrompt = `
请为这位有缘人进行深度的数字能量开示。
他们输入的号码是: ${result.original}
拆解出的磁场链条是: ${pairsString}
用户当前最关心的焦点是: 【${aiFocus}】。

请以大师的口吻，输出三段核心内容：
1. 【磁场定调】：直指核心，结合"阴阳平衡"，一针见血地指出这组号码在用户关心的【${aiFocus}】上是吉是凶，问题出在哪里。
2. 【运势推演】：描述如果继续使用这组号码，未来1-3年在【${aiFocus}】上会发生什么具体情境。
3. 【破局改运建议】：提供具体的"补运化解数字组合"（例如建议在密码或微信号后加一组4位数的吉星组合，如1314或8678等），并解释为什么这组数字能化解原号码的煞气（以凶化吉，补足财库或人脉）。`;

        const payload = {
          contents: [{ parts: [{ text: userPrompt }] }],
          systemInstruction: { parts: [{ text: systemPrompt }] },
          generationConfig: { temperature: 0.8, maxOutputTokens: 800 }
        };

        try {
          const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-05-20:generateContent?key=${key}`;
          const data = await fetchWithRetry(url, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });
          const text = data?.candidates?.[0]?.content?.parts?.[0]?.text;
          if (text) setAiReading(text);
          else throw new Error('Invalid API response structure');
        } catch (err) {
          console.error('AI Error:', err);
          setAiReading('⚠️ 哎呀，老头子我今天闭关修炼，天机暂不可泄露。请检查您的 API Key 或网络，稍后再来结缘。');
        } finally {
          setIsAiLoading(false);
        }
      };

      /* ── Copy ── */
      const handleCopy = () => {
        if (!result) return;
        let text = `【八星数字能量解析】\n号码：${inputValue}\n\n磁场拆解：\n${result.pairs.map(p=>`[${p.pair}] -> ${p.name} (${p.type})`).join('\n')}\n\n基础简批：\n${result.advice}\n`;
        if (aiReading) text += `\n【大师深度开示】\n${aiReading.replace(/<[^>]*>?/gm,'')}`;
        text += '\n*结果仅供参考，八星磁场需结合生辰八字综合论断。';
        navigator.clipboard?.writeText(text).catch(() => {});
        setCopied(true);
        setTimeout(() => setCopied(false), 2000);
      };

      const starColor = (type) => {
        if (type==='吉') return 'bg-emerald-500/20 text-emerald-400 border-emerald-500/30';
        if (type==='凶') return 'bg-red-500/20 text-red-400 border-red-500/30';
        return 'bg-amber-500/20 text-amber-400 border-amber-500/30';
      };

      /* ── Render ── */
      return (
        <div className="min-h-screen bg-slate-950 text-slate-100 font-sans">

          {showKeyModal && (
            <ApiKeyModal
              onSave={k => setApiKey(k)}
              onClose={() => setShowKeyModal(false)}
            />
          )}

          {/* Header */}
          <header className="border-b border-slate-800 bg-slate-900/50 backdrop-blur-md sticky top-0 z-10">
            <div className="max-w-4xl mx-auto px-4 py-4 flex items-center justify-between">
              <div className="flex items-center space-x-2">
                <div className="w-8 h-8 rounded-full bg-gradient-to-tr from-amber-600 to-yellow-400 flex items-center justify-center shadow-lg shadow-amber-500/20">
                  <Sparkles className="w-4 h-4 text-slate-900" />
                </div>
                <h1 className="text-xl font-bold tracking-wider bg-clip-text text-transparent bg-gradient-to-r from-amber-200 to-yellow-500">
                  星曜数字能量
                </h1>
              </div>
              <button
                onClick={() => setShowKeyModal(true)}
                title="配置 Gemini API Key"
                className="flex items-center text-xs text-slate-500 hover:text-amber-400 transition-colors border border-slate-700 hover:border-amber-500/40 rounded-lg px-3 py-1.5 gap-1.5"
              >
                <KeyRound className="w-3.5 h-3.5" />
                <span className="hidden sm:inline">{apiKey ? 'API Key ✓' : '设置 API Key'}</span>
              </button>
            </div>
          </header>

          <main className="max-w-4xl mx-auto px-4 py-8">

            {/* Hero Input */}
            <section className="text-center py-10">
              <h2 className="text-3xl md:text-5xl font-extrabold mb-4 tracking-tight text-white">
                测算你的 <span className="text-amber-400">生命磁场</span>
              </h2>
              <p className="text-slate-400 mb-10 max-w-lg mx-auto">
                输入你的手机号、车牌号或身份证号，运用马来西亚大师传授的《八星数字能量学》，一键拆解运势、财富与姻缘密码。
              </p>

              <form onSubmit={handleAnalyze} className="max-w-xl mx-auto relative group">
                <div className="absolute inset-0 bg-amber-500/20 blur-xl rounded-full opacity-0 group-hover:opacity-100 transition duration-500 pointer-events-none"></div>
                <div className="relative flex items-center bg-slate-900 border border-slate-700 rounded-full p-2 shadow-2xl overflow-hidden focus-within:border-amber-500/50 transition-colors">
                  <Search className="w-6 h-6 text-slate-500 ml-4 hidden sm:block" />
                  <input
                    type="text"
                    value={inputValue}
                    onChange={e => setInputValue(e.target.value)}
                    placeholder="例如: 014-6394134 或 车牌号..."
                    className="flex-1 bg-transparent border-none outline-none px-4 py-3 text-lg text-white placeholder-slate-600"
                  />
                  <button
                    type="submit"
                    disabled={isAnalyzing}
                    className="bg-gradient-to-r from-amber-600 to-yellow-500 hover:from-amber-500 hover:to-yellow-400 text-slate-950 font-bold px-8 py-3 rounded-full flex items-center transition-all disabled:opacity-70"
                  >
                    {isAnalyzing
                      ? <span className="flex items-center"><Activity className="w-5 h-5 mr-2 animate-spin" />排盘中...</span>
                      : '立即解析'}
                  </button>
                </div>
              </form>

              {errorMsg && (
                <p className="text-red-400 mt-4 flex items-center justify-center">
                  <AlertTriangle className="w-4 h-4 mr-2" />{errorMsg}
                </p>
              )}
            </section>

            {/* Results */}
            {result && (
              <div className="mt-4 animate-fade-in-up">

                <div className="flex justify-between items-end mb-4">
                  <h3 className="text-2xl font-bold flex items-center">
                    <ShieldCheck className="w-6 h-6 mr-2 text-amber-400" />基础排盘报告
                  </h3>
                  <button onClick={handleCopy} className="text-sm flex items-center text-slate-400 hover:text-amber-400 transition-colors">
                    {copied
                      ? <><CheckCircle2 className="w-4 h-4 mr-1 text-emerald-500" />已复制</>
                      : <><Copy className="w-4 h-4 mr-1" />复制报告</>}
                  </button>
                </div>

                <div className="bg-slate-900/80 border border-slate-800 rounded-2xl p-6 shadow-xl backdrop-blur-sm mb-8">

                  {/* Number chain */}
                  <div className="mb-10">
                    <p className="text-sm text-slate-500 mb-4 uppercase tracking-widest">能量数组链 (Number Chain)</p>
                    <div className="flex flex-wrap gap-2 md:gap-4 justify-center py-6 bg-slate-950/50 rounded-xl border border-slate-800/50 relative overflow-hidden">
                      <div className="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-transparent via-amber-500/20 to-transparent pointer-events-none"></div>
                      {result.pairs.map((p, idx) => (
                        <div key={idx} className="flex items-center">
                          <div className={`flex flex-col items-center p-3 rounded-lg border backdrop-blur-md transition-transform hover:-translate-y-1 ${starColor(p.type)}`}>
                            <span className="text-2xl md:text-3xl font-mono font-bold tracking-widest mb-1">{p.pair}</span>
                            <span className="text-xs md:text-sm font-medium">{p.name}</span>
                          </div>
                          {idx < result.pairs.length - 1 && (
                            <ChevronRight className="w-4 h-4 text-slate-700 mx-1 md:mx-2" />
                          )}
                        </div>
                      ))}
                    </div>
                  </div>

                  {/* Stats + Advice grid */}
                  <div className="grid md:grid-cols-2 gap-6">

                    <div className="bg-slate-950/50 rounded-xl p-5 border border-slate-800/50">
                      <h4 className="font-semibold text-amber-400 flex items-center mb-4">
                        <Activity className="w-5 h-5 mr-2" />磁场占比
                      </h4>
                      <div className="space-y-4">
                        {[
                          { label:'吉星磁场 (正能量)', key:'吉', color:'bg-emerald-500', text:'text-emerald-400' },
                          { label:'凶星磁场 (负能量/波折)', key:'凶', color:'bg-red-500', text:'text-red-400' },
                          { label:'平星磁场 (伏位/过渡)', key:'平', color:'bg-amber-500', text:'text-amber-400' },
                        ].map(({ label, key, color, text }) => (
                          <div key={key}>
                            <div className="flex justify-between items-center text-sm mb-1">
                              <span className="text-slate-400">{label}</span>
                              <span className={`font-mono ${text}`}>{result.summary[key]} 组</span>
                            </div>
                            <div className="w-full bg-slate-800 rounded-full h-2">
                              <div className={`${color} h-2 rounded-full transition-all duration-700`}
                                   style={{ width: `${(result.summary[key] / result.pairs.length) * 100}%` }}></div>
                            </div>
                          </div>
                        ))}
                      </div>
                    </div>

                    <div className="bg-gradient-to-br from-amber-950/30 to-slate-950 rounded-xl p-5 border border-amber-900/30">
                      <h4 className="font-semibold text-amber-400 flex items-center mb-4">
                        <Info className="w-5 h-5 mr-2" />基础简批
                      </h4>
                      <p className="text-slate-300 text-sm md:text-base leading-relaxed whitespace-pre-line">
                        {result.advice}
                      </p>
                    </div>
                  </div>
                </div>
                {/* Disclaimer */}
                <p className="text-center text-xs text-slate-600 mt-8 mb-4">
                  * 声明：数字能量学为传统易理磁场推演，分析结果仅供娱乐与参考，切勿过度迷信。命运掌握在自己手中。
                </p>
              </div>
            )}
          </main>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
