<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>星财能量 - 八星数字磁场解析</title>
    
    <!-- 引入 Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- 引入 Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <!-- 配置 Tailwind 主题颜色 -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['system-ui', '-apple-system', 'Segoe UI', 'Roboto', 'Helvetica', 'Arial', 'sans-serif'],
                        mono: ['ui-monospace', 'SFMono-Regular', 'Menlo', 'Monaco', 'Consolas', 'monospace'],
                    }
                }
            }
        }
    </script>

    <style>
        ::selection { background-color: rgba(245, 158, 11, 0.3); }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #020617; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #475569; }
        
        .fade-in { animation: fadeIn 0.6s ease-out forwards; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="min-h-screen bg-slate-950 text-slate-100 font-sans selection:bg-amber-500/30">

    <!-- 顶部导航 -->
    <header class="border-b border-slate-800 bg-slate-900/50 backdrop-blur-md sticky top-0 z-10">
        <div class="max-w-4xl mx-auto px-4 py-4 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                
                <!-- 直接引用本地同目录下的 image.png.png 图片 -->
                <img 
                    src="image.png.png" 
                    alt="星财 Logo" 
                    class="h-10 w-auto object-contain drop-shadow-md"
                    onerror="this.style.display='none'"
                />

                <h1 class="text-xl font-bold tracking-wider bg-clip-text text-transparent bg-gradient-to-r from-amber-200 to-yellow-500">
                    星财八星数字能量
                </h1>
            </div>
        </div>
    </header>

    <main class="max-w-4xl mx-auto px-4 py-8 pb-20">
        
        <!-- 输入区域 Hero -->
        <section class="text-center py-10">
            <h2 class="text-3xl md:text-5xl font-extrabold mb-4 tracking-tight text-white">
                测算你的 <span class="text-amber-400">生命磁场</span>
            </h2>
            <p class="text-slate-400 mb-10 max-w-lg mx-auto">
                输入您的身份证号、手机号或车牌号（英文会自动忽略），运用易理精髓《八星数字能量学》，一键拆解运势、财富与姻缘密码。
            </p>

            <form id="analyzeForm" class="max-w-xl mx-auto relative group">
                <div class="absolute inset-0 bg-amber-500/20 blur-xl rounded-full opacity-0 group-hover:opacity-100 transition duration-500 pointer-events-none"></div>
                <div class="relative flex items-center bg-slate-900 border border-slate-700 rounded-full p-2 shadow-2xl overflow-hidden focus-within:border-amber-500/50 transition-colors">
                    <i class="ph ph-magnifying-glass text-slate-500 text-2xl ml-4 hidden sm:block"></i>
                    <input 
                        type="text" 
                        id="numberInput"
                        placeholder="例如: 014-6394134, 950812-10-5888..." 
                        class="flex-1 bg-transparent border-none outline-none px-4 py-3 text-lg text-white placeholder-slate-600 w-full"
                    />
                    <button 
                        type="submit"
                        id="submitBtn"
                        class="bg-gradient-to-r from-amber-600 to-yellow-500 hover:from-amber-500 hover:to-yellow-400 text-slate-950 font-bold px-6 md:px-8 py-3 rounded-full flex items-center transition-all disabled:opacity-70 flex-shrink-0"
                    >
                        <span id="btnText" class="flex items-center">立即解析</span>
                    </button>
                </div>
            </form>
            
            <p id="errorMsg" class="text-red-400 mt-4 flex items-center justify-center hidden">
                <i class="ph-fill ph-warning-circle mr-2"></i> <span id="errorText"></span>
            </p>
        </section>

        <!-- 结果展示区 -->
        <div id="resultContainer" class="mt-4 hidden fade-in">
            
            <div class="flex justify-between items-end mb-4">
                <h3 class="text-2xl font-bold flex items-center">
                    <i class="ph-fill ph-shield-check text-amber-400 text-3xl mr-2"></i>
                    排盘解析报告
                </h3>
                <button id="copyBtn" class="text-sm flex items-center text-slate-400 hover:text-amber-400 transition-colors">
                    <i class="ph ph-copy mr-1 text-lg"></i>
                    <span id="copyBtnText">复制报告</span>
                </button>
            </div>

            <div class="bg-slate-900/80 border border-slate-800 rounded-2xl p-6 shadow-xl backdrop-blur-sm">
                
                <!-- 数字链视图 -->
                <div class="mb-10">
                    <p class="text-sm text-slate-500 mb-4 uppercase tracking-widest">能量数组链 (Number Chain)</p>
                    <div id="numberChain" class="flex flex-wrap gap-2 md:gap-4 justify-center py-6 bg-slate-950/50 rounded-xl border border-slate-800/50 relative overflow-hidden">
                        <div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-transparent via-amber-500/20 to-transparent"></div>
                    </div>
                </div>

                <!-- 两列布局：图表摘要 & 大师断言 -->
                <div class="grid md:grid-cols-2 gap-6">
                    
                    <!-- 左侧：磁场统计 -->
                    <div class="bg-slate-950/50 rounded-xl p-5 border border-slate-800/50">
                        <h4 class="font-semibold text-amber-400 flex items-center mb-4">
                            <i class="ph-fill ph-chart-line-up mr-2 text-xl"></i> 磁场占比
                        </h4>
                        <div class="space-y-4">
                            <div class="flex justify-between items-center text-sm">
                                <span class="text-slate-400">吉星磁场 (正能量)</span>
                                <span id="statJi" class="font-mono text-emerald-400">0 组</span>
                            </div>
                            <div class="w-full bg-slate-800 rounded-full h-2">
                                <div id="barJi" class="bg-emerald-500 h-2 rounded-full" style="width: 0%"></div>
                            </div>

                            <div class="flex justify-between items-center text-sm pt-2">
                                <span class="text-slate-400">凶星磁场 (负能量/波折)</span>
                                <span id="statXiong" class="font-mono text-red-400">0 组</span>
                            </div>
                            <div class="w-full bg-slate-800 rounded-full h-2">
                                <div id="barXiong" class="bg-red-500 h-2 rounded-full" style="width: 0%"></div>
                            </div>

                            <div class="flex justify-between items-center text-sm pt-2">
                                <span class="text-slate-400">平星磁场 (伏位/过渡)</span>
                                <span id="statPing" class="font-mono text-amber-400">0 组</span>
                            </div>
                            <div class="w-full bg-slate-800 rounded-full h-2">
                                <div id="barPing" class="bg-amber-500 h-2 rounded-full" style="width: 0%"></div>
                            </div>
                        </div>
                    </div>

                    <!-- 右侧：断言简批 -->
                    <div class="bg-gradient-to-br from-amber-950/30 to-slate-950 rounded-xl p-5 border border-amber-900/30 flex flex-col">
                        <h4 class="font-semibold text-amber-400 flex items-center mb-4">
                            <i class="ph-fill ph-info mr-2 text-xl"></i> 易理直断
                        </h4>
                        <p id="masterAdvice" class="text-slate-300 text-sm md:text-base leading-relaxed whitespace-pre-line flex-1">
                        </p>
                    </div>
                </div>

                <!-- 详细释义列表 -->
                <div class="mt-8">
                    <h4 class="font-semibold text-slate-200 flex items-center mb-4">
                        <i class="ph-fill ph-list-magnifying-glass mr-2 text-slate-400 text-xl"></i> 逐层磁场剖析
                    </h4>
                    <div id="detailedGrid" class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    </div>
                </div>

            </div>
            
            <p class="text-center text-xs text-slate-600 mt-8 mb-4">
                * 声明：数字能量学为传统易理磁场推演，分析结果仅供娱乐与参考，切勿过度迷信。
            </p>

        </div>
    </main>

    <script>
        const STAR_MAPPING = {
            '13': { name: '天医', type: '吉', level: 1, desc: '大财、正姻缘、聪明、业绩高' },
            '31': { name: '天医', type: '吉', level: 1, desc: '大财、正姻缘、聪明、业绩高' },
            '68': { name: '天医', type: '吉', level: 2, desc: '中财、婚姻平稳、赚钱不难' },
            '86': { name: '天医', type: '吉', level: 2, desc: '中财、婚姻平稳、赚钱不难' },
            '49': { name: '天医', type: '吉', level: 3, desc: '小财、财运平平、付出多' },
            '94': { name: '天医', type: '吉', level: 3, desc: '小财、财运平平、付出多' },
            '27': { name: '天医', type: '吉', level: 4, desc: '微财、贵人少、赚钱辛苦' },
            '72': { name: '天医', type: '吉', level: 4, desc: '微财、贵人少、赚钱辛苦' },

            '19': { name: '延年', type: '吉', level: 1, desc: '事业心强、领导格局、压力大' },
            '91': { name: '延年', type: '吉', level: 1, desc: '事业心强、领导格局、压力大' },
            '78': { name: '延年', type: '吉', level: 2, desc: '能力强、责任心重、有担当' },
            '87': { name: '延年', type: '吉', level: 2, desc: '能力强、责任心重、有担当' },
            '43': { name: '延年', type: '吉', level: 3, desc: '工作平顺、事业一般' },
            '34': { name: '延年', type: '吉', level: 3, desc: '工作平顺、事业一般' },
            '26': { name: '延年', type: '吉', level: 4, desc: '随遇而安、工作能力较弱' },
            '62': { name: '延年', type: '吉', level: 4, desc: '随遇而安、工作能力较弱' },

            '14': { name: '生气', type: '吉', level: 1, desc: '大贵人、好名声、乐天派' },
            '41': { name: '生气', type: '吉', level: 1, desc: '大贵人、好名声、乐天派' },
            '67': { name: '生气', type: '吉', level: 2, desc: '中贵人、人缘好、开心' },
            '76': { name: '生气', type: '吉', level: 2, desc: '中贵人、人缘好、开心' },
            '39': { name: '生气', type: '吉', level: 3, desc: '小贵人、亲戚朋友帮忙' },
            '93': { name: '生气', type: '吉', level: 3, desc: '小贵人、亲戚朋友帮忙' },
            '28': { name: '生气', type: '吉', level: 4, desc: '微贵人、朋友多但助力小' },
            '82': { name: '生气', type: '吉', level: 4, desc: '微贵人、朋友多但助力小' },

            '11': { name: '伏位', type: '平', level: 1, desc: '蓄势待发、坚持、固执、被动' },
            '22': { name: '伏位', type: '平', level: 1, desc: '蓄势待发、坚持、固执、被动' },
            '88': { name: '伏位', type: '平', level: 2, desc: '耐心、平稳、保守' },
            '99': { name: '伏位', type: '平', level: 2, desc: '耐心、平稳、保守' },
            '66': { name: '伏位', type: '平', level: 3, desc: '随波逐流、等待时机' },
            '77': { name: '伏位', type: '平', level: 3, desc: '随波逐流、等待时机' },
            '33': { name: '伏位', type: '平', level: 4, desc: '单纯、死板、无主见' },
            '44': { name: '伏位', type: '平', level: 4, desc: '单纯、死板、无主见' },

            '12': { name: '绝命', type: '凶', level: 1, desc: '敢拼敢博、冲动、破财、情绪化' },
            '21': { name: '绝命', type: '凶', level: 1, desc: '敢拼敢博、冲动、破财、情绪化' },
            '69': { name: '绝命', type: '凶', level: 2, desc: '好胜心强、盲目投资、大起大落' },
            '96': { name: '绝命', type: '凶', level: 2, desc: '好胜心强、盲目投资、大起大落' },
            '48': { name: '绝命', type: '凶', level: 3, desc: '做事不圆融、容易起冲突' },
            '84': { name: '绝命', type: '凶', level: 3, desc: '做事不圆融、容易起冲突' },
            '37': { name: '绝命', type: '凶', level: 4, desc: '小脾气、抱怨、偏激' },
            '73': { name: '绝命', type: '凶', level: 4, desc: '小脾气、抱怨、偏激' },

            '18': { name: '五鬼', type: '凶', level: 1, desc: '才华横溢、多变、诡异、暗财' },
            '81': { name: '五鬼', type: '凶', level: 1, desc: '才华横溢、多变、诡异、暗财' },
            '79': { name: '五鬼', type: '凶', level: 2, desc: '鬼点子多、疑心重、不定性' },
            '97': { name: '五鬼', type: '凶', level: 2, desc: '鬼点子多、疑心重、不定性' },
            '36': { name: '五鬼', type: '凶', level: 3, desc: '反复无常、心机重' },
            '63': { name: '五鬼', type: '凶', level: 3, desc: '反复无常、心机重' },
            '24': { name: '五鬼', type: '凶', level: 4, desc: '小聪明、城府、变动' },
            '42': { name: '五鬼', type: '凶', level: 4, desc: '小聪明、城府、变动' },

            '16': { name: '六煞', type: '凶', level: 1, desc: '偏桃花、人际关系复杂、忧郁' },
            '61': { name: '六煞', type: '凶', level: 1, desc: '偏桃花、人际关系复杂、忧郁' },
            '47': { name: '六煞', type: '凶', level: 2, desc: '善于交际、情感丰富、烂桃花' },
            '74': { name: '六煞', type: '凶', level: 2, desc: '善于交际、情感丰富、烂桃花' },
            '38': { name: '六煞', type: '凶', level: 3, desc: '优柔寡断、情绪化、被情所困' },
            '83': { name: '六煞', type: '凶', level: 3, desc: '优柔寡断、情绪化、被情所困' },
            '29': { name: '六煞', type: '凶', level: 4, desc: '心思细腻、多愁善感' },
            '92': { name: '六煞', type: '凶', level: 4, desc: '心思细腻、多愁善感' },

            '17': { name: '祸害', type: '凶', level: 1, desc: '口才极佳、口舌是非、小人暗算' },
            '71': { name: '祸害', type: '凶', level: 1, desc: '口才极佳、口舌是非、小人暗算' },
            '89': { name: '祸害', type: '凶', level: 2, desc: '嘴硬、容易得罪人、血光' },
            '98': { name: '祸害', type: '凶', level: 2, desc: '嘴硬、容易得罪人、血光' },
            '46': { name: '祸害', type: '凶', level: 3, desc: '爱抱怨、身体虚弱' },
            '64': { name: '祸害', type: '凶', level: 3, desc: '爱抱怨、身体虚弱' },
            '23': { name: '祸害', type: '凶', level: 4, desc: '爱啰嗦、小病不断' },
            '32': { name: '祸害', type: '凶', level: 4, desc: '爱啰嗦、小病不断' },
        };

        let currentResultData = null;

        const form = document.getElementById('analyzeForm');
        const numberInput = document.getElementById('numberInput');
        const submitBtn = document.getElementById('submitBtn');
        const btnText = document.getElementById('btnText');
        const errorMsg = document.getElementById('errorMsg');
        const errorText = document.getElementById('errorText');
        const resultContainer = document.getElementById('resultContainer');
        const copyBtn = document.getElementById('copyBtn');
        
        const numberChain = document.getElementById('numberChain');
        const detailedGrid = document.getElementById('detailedGrid');
        const statJi = document.getElementById('statJi');
        const statXiong = document.getElementById('statXiong');
        const statPing = document.getElementById('statPing');
        const barJi = document.getElementById('barJi');
        const barXiong = document.getElementById('barXiong');
        const barPing = document.getElementById('barPing');
        const masterAdvice = document.getElementById('masterAdvice');

        function getStarData(pair) {
            if (STAR_MAPPING[pair]) return STAR_MAPPING[pair];
            let a = pair[0];
            let b = pair[1];
            if ((a === '0' || a === '5') && (b === '0' || b === '5')) {
                return { name: '伏位', type: '平', level: 4, desc: '平缓、停滞、隐性显性交替' };
            }
            if (a === '0' || a === '5') a = b;
            if (b === '0' || b === '5') b = a;
            return STAR_MAPPING[a + b] || { name: '未知', type: '平', level: 4, desc: '过渡磁场' };
        }

        function getStarColorClasses(type) {
            if (type === '吉') return 'bg-emerald-500/20 text-emerald-400 border-emerald-500/30';
            if (type === '凶') return 'bg-red-500/20 text-red-400 border-red-500/30';
            return 'bg-amber-500/20 text-amber-400 border-amber-500/30';
        }

        form.addEventListener('submit', function(e) {
            e.preventDefault();
            const inputValue = numberInput.value.trim();
            if (!inputValue) return;

            errorMsg.classList.add('hidden');
            resultContainer.classList.add('hidden');
            submitBtn.disabled = true;
            btnText.innerHTML = '<i class="ph ph-spinner ph-spin text-xl mr-2"></i> 排盘中...';

            const cleanNum = inputValue.replace(/\D/g, '');
            if (cleanNum.length < 2) {
                errorText.textContent = "请输入至少包含2位有效数字的号码！";
                errorMsg.classList.remove('hidden');
                submitBtn.disabled = false;
                btnText.innerHTML = '立即解析';
                return;
            }

            setTimeout(() => {
                const pairs = [];
                const summary = { 吉: 0, 凶: 0, 平: 0, 财库: false, 桃花: false, 口舌: false, 投资: false };
                
                for (let i = 0; i < cleanNum.length - 1; i++) {
                    const pairStr = cleanNum.slice(i, i + 2);
                    const star = getStarData(pairStr);
                    pairs.push({ pair: pairStr, ...star });

                    summary[star.type]++;
                    if (star.name === '天医') summary.财库 = true;
                    if (star.name === '六煞') summary.桃花 = true;
                    if (star.name === '祸害') summary.口舌 = true;
                    if (star.name === '绝命') summary.投资 = true;
                }

                let advice = `这组号码总共解析出 ${pairs.length} 组磁场。\n`;
                const lastStar = pairs[pairs.length - 1];
                
                if (summary.财库) {
                    advice += "✅ 此局带有【天医】磁场，主财运与正姻缘，具有极强的潜力。";
                } else {
                    advice += "⚠️ 此号缺乏【天医】财星，可能求财较为辛苦，容易财来财去一场空。";
                }

                if (summary.投资 && !summary.财库) {
                    advice += "致命伤在于有【绝命】但无财星守库，这是典型的“拼搏投资破财局”，投资极容易大起大落。";
                }

                if (summary.桃花) {
                    advice += "阵中带有【六煞】，说明心思细腻，交际圈不错，但需警惕烂桃花或情绪内耗。";
                }

                advice += `\n\n🎯 尾号定乾坤： 您的号码以【${lastStar.name}】收尾。`;
                if (lastStar.type === '凶') {
                    advice += `这在数字能量学中是大忌！${lastStar.name}收尾意味着结果往往波折、不稳定，容易功亏一篑。建议早做调和调整。`;
                } else if (lastStar.name === '延年' || lastStar.name === '天医') {
                    advice += `这属于非常不错的守财/升职局，能把赚到的财富和事业稳稳守住！`;
                } else {
                    advice += `整体结局偏向平缓，需结合您当下的具体情况综合论断。`;
                }

                currentResultData = { original: cleanNum, displayInput: inputValue, pairs, summary, advice };
                renderResult();

                submitBtn.disabled = false;
                btnText.innerHTML = '重新解析';
            }, 1000);
        });

        function renderResult() {
            const { pairs, summary, advice } = currentResultData;
            const totalPairs = pairs.length;

            let chainHtml = '';
            pairs.forEach((p, idx) => {
                const colorClasses = getStarColorClasses(p.type);
                chainHtml += `
                    <div class="flex items-center">
                        <div class="flex flex-col items-center p-3 rounded-lg border backdrop-blur-md transition-transform hover:-translate-y-1 ${colorClasses}">
                            <span class="text-2xl md:text-3xl font-mono font-bold tracking-widest mb-1">${p.pair}</span>
                            <span class="text-xs md:text-sm font-medium">${p.name}</span>
                        </div>
                        ${idx < totalPairs - 1 ? '<i class="ph ph-caret-right text-slate-700 mx-1 md:mx-2"></i>' : ''}
                    </div>
                `;
            });
            numberChain.innerHTML = chainHtml + `<div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-transparent via-amber-500/20 to-transparent"></div>`;

            statJi.textContent = `${summary.吉} 组`;
            statXiong.textContent = `${summary.凶} 组`;
            statPing.textContent = `${summary.平} 组`;
            
            barJi.style.width = `${(summary.吉 / totalPairs) * 100}%`;
            barXiong.style.width = `${(summary.凶 / totalPairs) * 100}%`;
            barPing.style.width = `${(summary.平 / totalPairs) * 100}%`;

            masterAdvice.textContent = advice;

            let gridHtml = '';
            pairs.forEach(p => {
                const colorClasses = getStarColorClasses(p.type);
                gridHtml += `
                    <div class="bg-slate-950/40 p-4 rounded-lg border border-slate-800 flex flex-col hover:border-slate-600 transition-colors">
                        <div class="flex justify-between items-start mb-2">
                            <span class="font-mono text-xl font-bold text-white">${p.pair}</span>
                            <span class="text-xs px-2 py-1 rounded border ${colorClasses}">
                                ${p.name} · ${p.level}级
                            </span>
                        </div>
                        <p class="text-sm text-slate-400 mt-auto">${p.desc}</p>
                    </div>
                `;
            });
            detailedGrid.innerHTML = gridHtml;

            resultContainer.classList.remove('hidden');
            setTimeout(() => {
                resultContainer.scrollIntoView({ behavior: 'smooth', block: 'start' });
            }, 100);
        }

        copyBtn.addEventListener('click', function() {
            if (!currentResultData) return;
            const { displayInput, pairs, advice } = currentResultData;
            const copyIcon = copyBtn.querySelector('i');
            const copyText = document.getElementById('copyBtnText');

            let text = `【星财八星数字能量解析】\n号码：${displayInput}\n\n磁场拆解：\n`;
            text += pairs.map(p => `[${p.pair}] -> ${p.name} (${p.type})`).join('\n');
            text += `\n\n易理直断：\n${advice}\n\n*结果仅供参考，八星磁场需结合生辰综合论断。`;
            
            const textarea = document.createElement('textarea');
            textarea.value = text;
            document.body.appendChild(textarea);
            textarea.select();
            try {
                document.execCommand('copy');
                copyIcon.className = 'ph-fill ph-check-circle mr-1 text-lg text-emerald-500';
                copyText.textContent = '已复制';
                copyText.classList.add('text-emerald-500');
                
                setTimeout(() => {
                    copyIcon.className = 'ph ph-copy mr-1 text-lg';
                    copyText.textContent = '复制报告';
                    copyText.classList.remove('text-emerald-500');
                }, 2000);
            } catch (err) {
                alert('复制失败，请手动复制。');
            }
            document.body.removeChild(textarea);
        });
    </script>
</body>
</html>
